services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackathon}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration
    image: nestjs-crud-practice:migration
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hackathon}?schema=public"
    depends_on:
      postgres:
        condition: service_healthy
    command: pnpm prisma:deploy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: nestjs-crud-practice:local
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-hackathon}?schema=public"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${HOST_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  postgres_data:
